name: Bug report
description: Report a reproducible problem with IDAPro-MuiLs
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove private database contents, licensed binaries, and credentials from attachments.
  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: IDA 9.3, Windows 11, 150% scaling
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List the smallest sequence that demonstrates the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized diagnostics
      description: Paste relevant startup.log lines or attach a sanitized screenshot.
      render: text
