name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish
    runs-on: windows-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CI dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Run release checks
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m ruff check src scripts ida_modern_ui_loader.py --select E9,F63,F7,F82
          python scripts/run_checks.py --require-qt
          $version = "${{ github.ref_name }}".TrimStart("v")
          python scripts/build_release.py --version $version

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -LiteralPath dist -File |
            Where-Object { $_.Extension -in @(".zip", ".sha256") } |
            ForEach-Object { $_.FullName }
          if ($assets.Count -ne 2) {
            throw "Expected one ZIP and one checksum, found $($assets.Count) assets"
          }
          gh release create "${{ github.ref_name }}" $assets `
            --verify-tag `
            --generate-notes `
            --title "IDAPro-MuiLs ${{ github.ref_name }}"
