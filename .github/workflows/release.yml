name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish
    runs-on: windows-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CI dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Run release checks
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m ruff check src scripts ida_modern_ui_loader.py --select E9,F63,F7,F82
          if ($LASTEXITCODE -ne 0) { throw "Python error checks failed" }
          python scripts/run_checks.py --require-qt
          if ($LASTEXITCODE -ne 0) { throw "Release regression checks failed" }
          $version = "${{ github.ref_name }}".TrimStart("v")
          python scripts/build_release.py --version $version
          if ($LASTEXITCODE -ne 0) { throw "Release package build failed" }

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -LiteralPath dist -File |
            Where-Object { $_.Extension -in @(".zip", ".sha256") } |
            ForEach-Object { $_.FullName }
          if ($assets.Count -ne 2) {
            throw "Expected one ZIP and one checksum, found $($assets.Count) assets"
          }
          $tag = "${{ github.ref_name }}"
          $releaseArgs = @("release", "create", $tag) + $assets + @(
            "--verify-tag", "--title", "IDAPro-MuiLs $tag"
          )
          if ($tag.Contains("-")) {
            $releaseArgs += @("--prerelease", "--latest=false")
          }
          $notes = "docs/releases/$tag.md"
          if (Test-Path -LiteralPath $notes) {
            $releaseArgs += @("--notes-file", $notes)
          } else {
            $releaseArgs += "--generate-notes"
          }
          gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw "GitHub release publication failed" }
