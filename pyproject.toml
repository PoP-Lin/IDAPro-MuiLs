[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# The existing runtime predates repository-wide linting. CI currently gates
# syntax and high-confidence Python errors while the broader rule set remains
# available for incremental cleanup.

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
